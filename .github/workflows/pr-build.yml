---
name: PR Build Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: osado-gemini-tester:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: osado-gemini-tester:${{ env.IMAGE_TAG }}
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          format: 'table'

      - name: Smoke test — verify tool versions
        run: |
          docker run --rm \
            --memory 512m \
            --cpus 0.5 \
            --network none \
            osado-gemini-tester:${{ env.IMAGE_TAG }} \
            sh -c "gemini --version && opencode --version && claude --version && agy --version"
